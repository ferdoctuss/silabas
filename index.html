            text-align: center;
            background-color: #fff9e6;
            margin: 0;
            padding: 20px;
            user-select: none;
            position: relative;
            touch-action: manipulation; 
            overscroll-behavior-y: contain; 
        }

        #btn-config {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            padding: 8px 12px;
            background-color: #ffeaa7;
            color: #2d3436;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #fdcb6e;
            transition: all 0.1s;
            font-weight: bold;
            touch-action: manipulation;
            display: none;
        }
        #btn-config:active { transform: translateY(4px); box-shadow: 0 0 0 #fdcb6e; }

        h1 {
            color: #e17055;
            font-size: 2.2rem;
            margin-bottom: 0px;
            margin-top: 35px;
        }
        
        #question-text {
            font-size: 2.5rem;
            color: #0984e3;
            margin: 15px 0;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        #image-container {
            font-size: 6.5rem;
            margin: 5px auto;
            max-width: 600px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #word-builder {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 12px;
            margin: 20px auto;
            min-height: 70px;
            transition: all 0.5s ease;
        }

        .slot {
            width: 70px;
            height: 70px;
            border: 4px dashed #b2bec3;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3rem;
            font-weight: bold;
            color: transparent;
            background-color: transparent;
            transition: all 0.3s ease;
        }

        .slot.filled {
            background-color: #0984e3;
            border: 4px solid #0984e3;
            color: white;
            box-shadow: 0 6px 0 #005f9e;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }
        button.opcion {
            font-size: 2.4rem;
            font-weight: bold;
            padding: 15px 20px;
            border: none;
            border-radius: 20px;
            background-color: #00b894;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #006652;
            transition: opacity 0.3s ease, transform 0.1s; 
            min-width: 75px;
            flex: 1 1 25%; 
        }
        button.opcion:active { transform: translateY(6px); box-shadow: 0 0 0 #006652; }
        
        #message {
            font-size: 2.2rem;
            margin-top: 15px;
            font-weight: bold;
            min-height: 40px;
            opacity: 0;
        }

        #pantalla-inicio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 75vh;
            gap: 20px;
        }
        #btn-iniciar {
            font-size: 2.5rem;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 25px;
            background-color: #e17055;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #d63031;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        #btn-iniciar:active { transform: translateY(8px); box-shadow: 0 0 0 #d63031; }
        .intro-titulo { font-size: 3rem; color: #0984e3; margin-bottom: 10px; }
        .intro-icono { font-size: 5rem; }

        #juego-container { display: none; }

        .progress-wrapper {
            width: 85%;
            max-width: 450px;
            margin: 20px auto 10px auto;
            text-align: center;
        }
        #progress-text { font-size: 1.1rem; color: #0984e3; font-weight: bold; margin-bottom: 5px; }
        #progress-container {
            width: 100%;
            background-color: #dfe6e9;
            border-radius: 20px;
            height: 22px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
            border: 3px solid #b2bec3;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fdcb6e, #e17055);
            border-radius: 15px;
            transition: width 0.5s ease;
        }

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 350px;
            width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-content h3 { margin-top: 0; color: #2d3436; font-size: 1.8rem; margin-bottom: 20px; }
        
        .modal-botones-vertical { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .modal-botones-vertical button {
            font-size: 1.3rem; padding: 15px; border: none; border-radius: 15px;
            cursor: pointer; font-weight: bold; color: white; transition: all 0.1s;
        }
        .btn-facil { background-color: #1dd1a1; box-shadow: 0 5px 0 #10ac84; }
        .btn-medio { background-color: #feca57; box-shadow: 0 5px 0 #ff9f43; color: #2d3436 !important; }
        .btn-dificil { background-color: #ff6b6b; box-shadow: 0 5px 0 #ee5253; }
        .btn-gestor-menu { background-color: #a29bfe; box-shadow: 0 5px 0 #6c5ce7; }
        .modal-botones-vertical button:active { transform: translateY(5px); box-shadow: 0 0 0; }

        .btn-cancelar { 
            background-color: #b2bec3; box-shadow: 0 4px 0 #636e72; 
            font-size: 1.2rem; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: white;
        }
        .btn-cancelar:active { transform: translateY(4px); box-shadow: 0 0 0; }

        /* ESTILOS DEL GESTOR DE PALABRAS */
        .gestor-inputs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .gestor-inputs input {
            font-size: 1.2rem; padding: 12px; border-radius: 10px; border: 2px solid #dfe6e9; box-sizing: border-box; font-family: inherit;
        }
        .btn-agregar { background-color: #0984e3; box-shadow: 0 4px 0 #005f9e; color: white; border: none; padding: 12px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; }
        .btn-agregar:active { transform: translateY(4px); box-shadow: 0 0 0; }
        
        .gestor-lista {
            flex: 1; overflow-y: auto; text-align: left; padding-right: 5px; border-top: 2px solid #dfe6e9; padding-top: 10px;
        }
        .gestor-item {
            display: flex; align-items: center; justify-content: space-between; background: #f1f2f6; margin-bottom: 8px; padding: 10px 15px; border-radius: 10px;

        .gestor-item span { font-size: 1.4rem; font-weight: bold; color: #2d3436; }
        .gestor-item-botones button {
            font-size: 1.2rem; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; margin-left: 5px; color: white;

        .btn-escuchar { background-color: #00b894; box-shadow: 0 3px 0 #006652; }
        .btn-eliminar { background-color: #d63031; box-shadow: 0 3px 0 #b33939; }
        .gestor-item-botones button:active { transform: translateY(3px); box-shadow: 0 0 0; }
        
        @keyframes popIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .animacion-exito { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes growWord { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1.1); } }
        .word-complete { animation: growWord 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); background-color: #d63031; box-shadow: 0 6px 0 #b33939; } 40%, 80% { transform: translateX(10px); background-color: #d63031; box-shadow: 0 6px 0 #b33939; } }

            body { padding: 10px; }

            #question-text { font-size: 1.8rem; margin: 10px 0; }

            .slot { width: 55px; height: 55px; font-size: 1.8rem; }
            .options { gap: 10px; max-width: 350px; }
            button.opcion { font-size: 2rem; padding: 12px 10px; min-width: 60px; }
            #message { font-size: 1.8rem; min-height: 35px; }

        <div class="options" id="options-container"></div>
        <div id="message"></div>

            <div id="progress-container">

            <button class="btn-cancelar" onclick="cerrarSelector()">Cerrar</button>
        </div>
    </div>

                <!-- Se llena con JS -->

            <button class="btn-cancelar" style="margin-top: 15px;" onclick="cerrarGestorPalabras()">Volver</button>
        </div>

        ];

        // Cargar palabras guardadas o usar las de defecto
        let todasLasPalabras = JSON.parse(localStorage.getItem('palabrasPol'));
        if (!todasLasPalabras || todasLasPalabras.length === 0) {
            todasLasPalabras = [...bancoPorDefecto];
            localStorage.setItem('palabrasPol', JSON.stringify(todasLasPalabras));
        }

        let palabrasFacil = [];
        let palabrasMedio = [];
        let palabrasDificil = [];

        function clasificarPalabras() {
            palabrasFacil = todasLasPalabras.filter(p => p.silabas.length <= 2);
            palabrasMedio = todasLasPalabras.filter(p => p.silabas.length === 3);
            palabrasDificil = todasLasPalabras.filter(p => p.silabas.length >= 4);
        }
        clasificarPalabras(); // Ejecutar al cargar la página

        const silabasDistractoras = ["PA", "MA", "SA", "LA", "TA", "PE", "ME", "SE", "LE", "TE", "CA", "CO", "CU", "PO", "PI", "RO", "RU", "NA", "NO", "BO"];

        let currentLevel = 1;
        const maxLevels = 100;
        let itemActual = null;
        let ultimaPreguntaTexto = "";
        let silabasRestantes = []; 
        let silabasArmadas = [];
        
        let jugadasFacil = [];
        let jugadasMedio = [];
        let jugadasDificil = [];

        function mezclarArray(array) {
            let arrayCopia = [...array];
            for (let i = arrayCopia.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arrayCopia[i], arrayCopia[j]] = [arrayCopia[j], arrayCopia[i]];
            }
            return arrayCopia;
        }

        // --- FUNCIONES DE VOZ ---
        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let textoLimpio = texto.replace(/[¿?¡!🤔]/g, '');
                let utterance = new SpeechSynthesisUtterance(textoLimpio);
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function hablarSilaba(silaba) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let fonetica = silaba.toLowerCase();
                fonetica = fonetica.replace('a', 'á').replace('e', 'é').replace('i', 'í').replace('o', 'ó').replace('u', 'ú');
                fonetica = fonetica + ".";
                let utterance = new SpeechSynthesisUtterance(fonetica);
                utterance.lang = 'es-ES';
                utterance.rate = 0.75; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function repetirPreguntaActual() { hablar(ultimaPreguntaTexto); }

        // --- FUNCIONES DE MODALES ---
        function abrirSelector() { document.getElementById('modal-niveles').style.display = 'flex'; }
        function cerrarSelector() { document.getElementById('modal-niveles').style.display = 'none'; }
        
        function abrirGestorPalabras() {
            cerrarSelector();
            document.getElementById('modal-gestor').style.display = 'flex';
            renderizarListaGestor();
        }
        function cerrarGestorPalabras() {
            document.getElementById('modal-gestor').style.display = 'none';
            abrirSelector();
        }

        // --- FUNCIONES DEL GESTOR DE PALABRAS ---
        function renderizarListaGestor() {
            const listaDiv = document.getElementById('gestor-lista-palabras');
            listaDiv.innerHTML = "";
            todasLasPalabras.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "gestor-item";
                div.innerHTML = `
                    <span>${item.emoji} ${item.palabra}</span>
                    <div class="gestor-item-botones">
                        <button class="btn-escuchar" onclick="hablar('${item.palabra}')">🔊</button>
                        <button class="btn-eliminar" onclick="eliminarPalabra(${index})">🗑️</button>
                    </div>
                `;
                listaDiv.appendChild(div);
            });
        }

        function agregarPalabra() {
            let inputPalabra = document.getElementById('in-palabra').value.trim().toLowerCase();
            let inputSilabas = document.getElementById('in-silabas').value.trim().toUpperCase();
            let inputEmoji = document.getElementById('in-emoji').value.trim();

            if (!inputPalabra || !inputSilabas || !inputEmoji) {
                alert("Por favor, llena los 3 campos antes de agregar.");
                return;
            }

            let silabasArray = inputSilabas.split('-').map(s => s.trim());

            todasLasPalabras.unshift({
                palabra: inputPalabra,
                silabas: silabasArray,
                emoji: inputEmoji
            });

            guardarPalabras();
            renderizarListaGestor();

            // Limpiar inputs
            document.getElementById('in-palabra').value = "";
            document.getElementById('in-silabas').value = "";
            document.getElementById('in-emoji').value = "";
        }

        function eliminarPalabra(index) {
            if(confirm("¿Seguro que quieres borrar esta palabra?")) {
                todasLasPalabras.splice(index, 1);
                guardarPalabras();
                renderizarListaGestor();
            }
        }

        function guardarPalabras() {
            localStorage.setItem('palabrasPol', JSON.stringify(todasLasPalabras));
            clasificarPalabras(); 
            // Re-barajamos para que los cambios se reflejen en la partida actual
            jugadasFacil = mezclarArray(palabrasFacil);
            jugadasMedio = mezclarArray(palabrasMedio);
            jugadasDificil = mezclarArray(palabrasDificil);
        }

        // --- LÓGICA DEL JUEGO ---
        function seleccionarDificultad(nivelInicio) {
            currentLevel = nivelInicio;
            cerrarSelector();
            playLevel();
        }

        function empezarJuego() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('juego-container').style.display = 'block';
            document.getElementById('btn-config').style.display = 'block';
            
            jugadasFacil = mezclarArray(palabrasFacil);
            jugadasMedio = mezclarArray(palabrasMedio);
            jugadasDificil = mezclarArray(palabrasDificil);
            
            initGame();
        }

        function initGame() {
            currentLevel = 1;
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const questionText = document.getElementById('question-text');
            const imageContainer = document.getElementById('image-container');
            const builderContainer = document.getElementById('word-builder');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            messageDiv.className = "";
            messageDiv.textContent = "";
            builderContainer.classList.remove("word-complete");

            let porcentaje = (currentLevel / maxLevels) * 100;
            progressBar.style.width = porcentaje + "%";
            progressText.textContent = `Progreso: Nivel ${currentLevel} de ${maxLevels}`;

            // Seleccionar dificultad dinámicamente y asegurar que hay palabras
            if (currentLevel <= 30 && jugadasFacil.length > 0) {
                itemActual = jugadasFacil[(currentLevel - 1) % jugadasFacil.length];
                title.textContent = `Nivel ${currentLevel} (Fácil 😊)`;
            } else if (currentLevel <= 60 && jugadasMedio.length > 0) {
                itemActual = jugadasMedio[(currentLevel - 31) % jugadasMedio.length];
                title.textContent = `Nivel ${currentLevel} (Medio 😐)`;
            } else if (jugadasDificil.length > 0) {
                // Si está en nivel difícil o faltan palabras en los otros niveles
                let offset = currentLevel > 60 ? 61 : 1;
                itemActual = jugadasDificil[(currentLevel - offset) % jugadasDificil.length];
                title.textContent = `Nivel ${currentLevel} (Difícil 🥵)`;
            } else {
                // Failsafe por si el usuario borra TODO el diccionario
                itemActual = { palabra: "pol", silabas: ["POL"], emoji: "👦" }; 
                title.textContent = `Nivel ${currentLevel}`;
            }

            silabasRestantes = [...itemActual.silabas]; 
            silabasArmadas = []; 

            let textoPregunta = `¿Cómo se escribe ${itemActual.palabra}?`;
            questionText.textContent = textoPregunta + " 🤔";
            ultimaPreguntaTexto = textoPregunta;
            
            hablar(textoPregunta);
            imageContainer.innerHTML = itemActual.emoji;

            builderContainer.innerHTML = "";
            for(let i=0; i < itemActual.silabas.length; i++) {
                const slot = document.createElement('div');
                slot.className = "slot";
                slot.id = "slot-" + i;
                builderContainer.appendChild(slot);
            }

            let options = [...itemActual.silabas];
            let totalBotones = itemActual.silabas.length + 2;
            
            while (options.length < totalBotones) {
                let randomSilaba = silabasDistractoras[Math.floor(Math.random() * silabasDistractoras.length)];
                if (!options.includes(randomSilaba)) {
                    options.push(randomSilaba);
                }
            }

            options.sort(() => Math.random() - 0.5);

            optionsDiv.innerHTML = "";
            options.forEach(silaba => {
                const btn = document.createElement('button');
                btn.className = "opcion";
                btn.textContent = silaba;
                btn.onclick = () => procesarToque(btn, silaba);
                optionsDiv.appendChild(btn);
            });
        }

        function procesarToque(btn, silabaTocada) {
            hablarSilaba(silabaTocada);

            if (silabaTocada === silabasRestantes[0]) {
                silabasRestantes.shift(); 
                silabasArmadas.push(silabaTocada); 

                btn.style.visibility = 'hidden'; 

                const slotActual = document.getElementById("slot-" + (silabasArmadas.length - 1));
                slotActual.textContent = silabaTocada;
                slotActual.classList.add("filled");

                if (silabasRestantes.length === 0) {
                    terminarNivel();
                }

            } else {
                btn.classList.add("shake-animation");
                setTimeout(() => { btn.classList.remove("shake-animation"); }, 400); 
            }
        }

        function terminarNivel() {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const builderContainer = document.getElementById('word-builder');

            const buttons = Array.from(optionsDiv.children);
            buttons.forEach(btn => {
                btn.style.opacity = "0";
                btn.style.pointerEvents = "none";
            });

            builderContainer.classList.add("word-complete");

            messageDiv.textContent = `¡Muy bien! 🎉`;
            messageDiv.style.color = "#00b894";
            messageDiv.className = "animacion-exito";
            
            setTimeout(() => { hablar(`${itemActual.palabra}, muy bien Pol`); }, 600);

            setTimeout(() => {
                currentLevel++;
                if (currentLevel > maxLevels) {
                    endGame();
                } else {
                    playLevel();
                }
            }, 3000); 
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Lo lograste!";
            document.getElementById('question-text').textContent = "¡Armaste todas las palabras!";
            document.getElementById('image-container').innerHTML = "🏆👑🥳✨";
            document.getElementById('word-builder').innerHTML = "";
            document.getElementById('progress-bar').style.width = "100%";
            document.getElementById('progress-text').textContent = "¡Completado al 100%!";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('btn-config').style.display = 'none';
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Eres un campeón, Pol!";
            messageDiv.style.color = "#e17055";
            messageDiv.className = "animacion-exito";
            
            hablar("¡Completaste todas las palabras, eres un campeón, Pol!");

            const restartBtn = document.createElement('button');
            restartBtn.className = "opcion";
            restartBtn.textContent = "Jugar de nuevo";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.style.flex = "none";
            restartBtn.style.width = "auto";
            restartBtn.onclick = () => {
                document.getElementById('btn-config').style.display = 'block';
                jugadasFacil = mezclarArray(palabrasFacil);
                jugadasMedio = mezclarArray(palabrasMedio);
                jugadasDificil = mezclarArray(palabrasDificil);
                initGame();
            };
            document.getElementById('options-container').appendChild(restartBtn);
        }
    </script>
</body>
</html>

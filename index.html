<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de Sílabas para Pol</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            background-color: #fff9e6;
            margin: 0;
            padding: 20px;
            user-select: none;
            position: relative;
            touch-action: manipulation; 
            overscroll-behavior-y: contain; 
        }

        h1 {
            color: #e17055;
            font-size: 2.2rem;
            margin-bottom: 0px;
            margin-top: 35px;
        }
        
        #question-text {
            font-size: 2.5rem;
            color: #0984e3;
            margin: 20px 0;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        #image-container {
            font-size: 7rem;
            margin: 15px auto;
            max-width: 600px;
            min-height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button.opcion {
            font-size: 2.8rem;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 20px;
            background-color: #00b894;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #006652;
            transition: all 0.1s;
            touch-action: manipulation;
            min-width: 90px;
        }
        button.opcion:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #006652;
        }
        button.opcion:disabled {
            background-color: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
        }
        
        #message {
            font-size: 2.5rem;
            margin-top: 15px;
            font-weight: bold;
            min-height: 55px;
            opacity: 0;
        }

        #pantalla-inicio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 75vh;
            gap: 20px;
        }
        #btn-iniciar {
            font-size: 2.5rem;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 25px;
            background-color: #e17055;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #d63031;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        #btn-iniciar:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #d63031;
        }
        .intro-titulo {
            font-size: 3rem;
            color: #0984e3;
            margin-bottom: 10px;
        }
        .intro-icono {
            font-size: 5rem;
        }

        #juego-container {
            display: none;
        }

        .progress-wrapper {
            width: 85%;
            max-width: 450px;
            margin: 25px auto 10px auto;
            text-align: center;
        }
        #progress-text {
            font-size: 1.1rem;
            color: #0984e3;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #progress-container {
            width: 100%;
            background-color: #dfe6e9;
            border-radius: 20px;
            height: 22px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
            border: 3px solid #b2bec3;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fdcb6e, #e17055);
            border-radius: 15px;
            transition: width 0.5s ease;
        }
        
        @keyframes reboteMagico {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animacion-exito {
            animation: reboteMagico 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animacion-error {
            opacity: 1 !important;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 {
                font-size: 1.5rem; 
                margin-top: 45px;  
            }
            #question-text {
                font-size: 2rem;
                margin: 15px 0;
            }
            #image-container {
                font-size: 5.5rem;
                min-height: 100px;
            }
            .options { gap: 10px; }
            button.opcion {
                font-size: 2.4rem;
                padding: 12px 20px;
                flex: 1; 
            }
            #message { font-size: 1.6rem; }
            .intro-titulo { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div class="intro-icono">abc 🔤</div>
        <div class="intro-titulo">¡A Jugar con Sílabas!</div>
        <button id="btn-iniciar" onclick="empezarJuego()">¡Iniciar Juego!</button>
    </div>

    <div id="juego-container">
        <h1 id="level-title">Nivel 1</h1>
        <div id="question-text" onclick="repetirPreguntaActual()">¿Con qué sílaba empieza? 🤔</div>
        
        <div id="image-container"></div>

        <div class="options" id="options-container"></div>
        <div id="message"></div>

        <div class="progress-wrapper">
            <div id="progress-text">Progreso: Nivel 1 de 20</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function (event) {
            if (event.scale !== 1) {
                event.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        let currentLevel = 1;
        const maxLevels = 20;
        
        const palabrasBanco = [
            { palabra: "casa", silaba: "CA", emoji: "🏠" },
            { palabra: "perro", silaba: "PE", emoji: "🐶" },
            { palabra: "gato", silaba: "GA", emoji: "🐱" },
            { palabra: "mesa", silaba: "ME", emoji: "🪑" },
            { palabra: "luna", silaba: "LU", emoji: "🌙" },
            { palabra: "sol", silaba: "SO", emoji: "☀️" },
            { palabra: "auto", silaba: "AU", emoji: "🚗" },
            { palabra: "moto", silaba: "MO", emoji: "🏍️" },
            { palabra: "pato", silaba: "PA", emoji: "🦆" },
            { palabra: "bola", silaba: "BO", emoji: "⚽" },
            { palabra: "fono", silaba: "FO", emoji: "☎️" },
            { palabra: "rana", silaba: "RA", emoji: "🐸" },
            { palabra: "sapo", silaba: "SA", emoji: "🐸" },
            { palabra: "taza", silaba: "TA", emoji: "☕" },
            { palabra: "vaca", silaba: "VA", emoji: "🐮" },
            { palabra: "mano", silaba: "MA", emoji: "✋" },
            { palabra: "nube", silaba: "NU", emoji: "☁️" },
            { palabra: "fresa", silaba: "FRE", emoji: "🍓" },
            { palabra: "dado", silaba: "DA", emoji: "🎲" },
            { palabra: "bota", silaba: "BO", emoji: "👢" }
        ];

        const silabasDistractoras = ["PA", "MA", "SA", "LA", "TA", "PE", "ME", "SE", "LE", "TE", "CA", "CO", "CU", "PO", "PI"];

        let itemActual = null;
        let ultimaPreguntaTexto = "";

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                // Limpiamos signos e introducimos espacios estratégicos en las sílabas (ej. "GA" pasa a sonar "g a" o fonema limpio)
                let textoLimpio = texto.replace(/[¿?¡!🤔]/g, '');
                
                let utterance = new SpeechSynthesisUtterance(textoLimpio);
                utterance.lang = 'es-ES';
                utterance.rate = 0.8; // Más pausado para que vocalice perfecto
                window.speechSynthesis.speak(utterance);
            }
        }

        // Función especial para leer la sílaba con claridad forzada
        function hablarSilaba(silaba) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                // Separar las letras con un pequeño punto o espacio fuerza al sintetizador de Android a leer el sonido fonético
                let silabaFonetica = silaba.split('').join(' ');
                let utterance = new SpeechSynthesisUtterance(silabaFonetica);
                utterance.lang = 'es-ES';
                utterance.rate = 0.7; // Muy pausado para que suene claro (ej. "g... a")
                window.speechSynthesis.speak(utterance);
            }
        }

        function repetirPreguntaActual() {
            hablar(ultimaPreguntaTexto);
        }

        function empezarJuego() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('juego-container').style.display = 'block';
            initGame();
        }

        function initGame() {
            currentLevel = 1;
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const questionText = document.getElementById('question-text');
            const imageContainer = document.getElementById('image-container');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            messageDiv.className = "";
            messageDiv.textContent = "";

            let porcentaje = (currentLevel / maxLevels) * 100;
            progressBar.style.width = porcentaje + "%";
            progressText.textContent = `Progreso: Nivel ${currentLevel} de ${maxLevels}`;

            title.textContent = `Nivel ${currentLevel}`;

            itemActual = palabrasBanco[(currentLevel - 1) % palabrasBanco.length];

            let textoPregunta = `¿Con qué sílaba empieza ${itemActual.palabra}?`;
            questionText.textContent = textoPregunta + " 🤔";
            ultimaPreguntaTexto = textoPregunta;
            
            hablar(textoPregunta);
            imageContainer.innerHTML = itemActual.emoji;

            let options = [itemActual.silaba];
            while (options.length < 3) {
                let randomSilaba = silabasDistractoras[Math.floor(Math.random() * silabasDistractoras.length)];
                if (!options.includes(randomSilaba)) {
                    options.push(randomSilaba);
                }
            }

            options.sort(() => Math.random() - 0.5);

            optionsDiv.innerHTML = "";
            options.forEach(silaba => {
                const btn = document.createElement('button');
                btn.className = "opcion";
                btn.textContent = silaba;
                // Al hacer clic o tocar, ahora lee la sílaba de forma fonética correcta
                btn.onclick = () => {
                    hablarSilaba(silaba);
                    checkAnswer(silaba);
                };
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedSilaba) {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const buttons = Array.from(optionsDiv.children);

            if (selectedSilaba === itemActual.silaba) {
                messageDiv.textContent = `¡Muy bien! 🎉🚀`;
                messageDiv.style.color = "#00b894";
                messageDiv.className = "animacion-exito";
                
                setTimeout(() => {
                    hablar(`Muy bien Pol`);
                }, 400);

                buttons.forEach(btn => btn.disabled = true);
                
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > maxLevels) {
                        endGame();
                    } else {
                        playLevel();
                    }
                }, 2400); 
            } else {
                messageDiv.textContent = "¡No! ❌";
                messageDiv.style.color = "#d63031";
                messageDiv.className = "animacion-error";
                hablar("No");
            }
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Lo lograste!";
            document.getElementById('question-text').textContent = "¡Completaste todas las sílabas!";
            document.getElementById('image-container').innerHTML = "🏆👑🥳✨";
            document.getElementById('progress-bar').style.width = "100%";
            document.getElementById('progress-text').textContent = "¡Completado al 100%!";
            document.getElementById('options-container').innerHTML = "";
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Eres un campeón leyendo, Pol!";
            messageDiv.style.color = "#e17055";
            messageDiv.className = "animacion-exito";
            
            hablar("¡Completaste todos los niveles de sílabas, eres un campeón, Pol!");

            const restartBtn = document.createElement('button');
            restartBtn.className = "opcion";
            restartBtn.textContent = "Jugar de nuevo";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.onclick = () => {
                initGame();
            };
            document.getElementById('options-container').appendChild(restartBtn);
        }
    </script>
</body>
</html>

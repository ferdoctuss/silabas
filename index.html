<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="icono3.png" sizes="any">
    <link rel="apple-touch-icon" href="icono3.png">
    <link rel="shortcut icon" href="icono3.png">
    
    <title>Juego de Armar Palabras para Pol</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            background-color: #fff9e6;
            margin: 0;
            padding: 20px;
            user-select: none;
            position: relative;
            touch-action: manipulation; 
            overscroll-behavior-y: contain; 
        }

        #btn-config {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            padding: 8px 12px;
            background-color: #ffeaa7;
            color: #2d3436;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #fdcb6e;
            transition: all 0.1s;
            font-weight: bold;
            touch-action: manipulation;
            display: none;
        }
        #btn-config:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #fdcb6e;
        }

        h1 {
            color: #e17055;
            font-size: 2.2rem;
            margin-bottom: 0px;
            margin-top: 35px;
        }
        
        #question-text {
            font-size: 2.5rem;
            color: #0984e3;
            margin: 15px 0;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        #image-container {
            font-size: 6.5rem;
            margin: 5px auto;
            max-width: 600px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #word-builder {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 12px;
            margin: 20px auto;
            min-height: 70px;
            transition: all 0.5s ease;
        }

        .slot {
            width: 70px;
            height: 70px;
            border: 4px dashed #b2bec3;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3rem;
            font-weight: bold;
            color: transparent;
            background-color: transparent;
            transition: all 0.3s ease;
        }

        .slot.filled {
            background-color: #0984e3;
            border: 4px solid #0984e3;
            color: white;
            box-shadow: 0 6px 0 #005f9e;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }
        button.opcion {
            font-size: 2.4rem;
            font-weight: bold;
            padding: 15px 20px;
            border: none;
            border-radius: 20px;
            background-color: #00b894;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #006652;
            transition: opacity 0.3s ease, transform 0.1s; 
            min-width: 75px;
            flex: 1 1 25%; 
        }
        button.opcion:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #006652;
        }
        
        #message {
            font-size: 2.2rem;
            margin-top: 15px;
            font-weight: bold;
            min-height: 40px;
            opacity: 0;
        }

        #pantalla-inicio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 75vh;
            gap: 20px;
        }
        #btn-iniciar {
            font-size: 2.5rem;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 25px;
            background-color: #e17055;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #d63031;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        #btn-iniciar:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #d63031;
        }
        .intro-titulo {
            font-size: 3rem;
            color: #0984e3;
            margin-bottom: 10px;
        }
        .intro-icono {
            font-size: 5rem;
        }

        #juego-container {
            display: none;
        }

        .progress-wrapper {
            width: 85%;
            max-width: 450px;
            margin: 20px auto 10px auto;
            text-align: center;
        }
        #progress-text {
            font-size: 1.1rem;
            color: #0984e3;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #progress-container {
            width: 100%;
            background-color: #dfe6e9;
            border-radius: 20px;
            height: 22px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
            border: 3px solid #b2bec3;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fdcb6e, #e17055);
            border-radius: 15px;
            transition: width 0.5s ease;
        }

        #modal-niveles {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 90%;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #2d3436;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .modal-botones-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .modal-botones-vertical button {
            font-size: 1.4rem;
            padding: 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: all 0.1s;
        }
        .btn-facil { background-color: #1dd1a1; box-shadow: 0 5px 0 #10ac84; }
        .btn-medio { background-color: #feca57; box-shadow: 0 5px 0 #ff9f43; color: #2d3436 !important; }
        .btn-dificil { background-color: #ff6b6b; box-shadow: 0 5px 0 #ee5253; }
        .modal-botones-vertical button:active { transform: translateY(5px); box-shadow: 0 0 0; }

        .btn-cancelar { 
            background-color: #b2bec3; 
            box-shadow: 0 4px 0 #636e72; 
            font-size: 1.2rem;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-cancelar:active { transform: translateY(4px); box-shadow: 0 0 0; }
        
        @keyframes popIn {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animacion-exito {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes growWord {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1.1); }
        }
        .word-complete {
            animation: growWord 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); background-color: #d63031; box-shadow: 0 6px 0 #b33939; }
            40%, 80% { transform: translateX(10px); background-color: #d63031; box-shadow: 0 6px 0 #b33939; }
        }
        .shake-animation {
            animation: shake 0.4s;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.5rem; margin-top: 45px; }
            #question-text { font-size: 1.8rem; margin: 10px 0; }
            #image-container { font-size: 5rem; min-height: 80px; }
            .slot { width: 55px; height: 55px; font-size: 1.8rem; }
            .options { gap: 10px; max-width: 350px; }
            button.opcion { font-size: 2rem; padding: 12px 10px; min-width: 60px; }
            #message { font-size: 1.8rem; min-height: 35px; }
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div class="intro-icono">🧩🔤</div>
        <div class="intro-titulo">¡Arma la Palabra!</div>
        <button id="btn-iniciar" onclick="empezarJuego()">¡Iniciar Juego!</button>
    </div>

    <div id="juego-container">
        <button id="btn-config" onclick="abrirSelector()">⚙️</button>

        <h1 id="level-title">Nivel 1</h1>
        <div id="question-text" onclick="repetirPreguntaActual()">¿Cómo se escribe? 🤔</div>
        
        <div id="image-container"></div>
        
        <div id="word-builder"></div>

        <div class="options" id="options-container"></div>
        <div id="message"></div>

        <div class="progress-wrapper">
            <div id="progress-text">Progreso: Nivel 1 de 100</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="modal-niveles">
        <div class="modal-content">
            <h3>Elige la dificultad</h3>
            <div class="modal-botones-vertical">
                <button class="btn-facil" onclick="seleccionarDificultad(1)">Fácil 😊 (1-30)</button>
                <button class="btn-medio" onclick="seleccionarDificultad(31)">Medio 😐 (31-60)</button>
                <button class="btn-dificil" onclick="seleccionarDificultad(61)">Difícil 🥵 (61-100)</button>
            </div>
            <button class="btn-cancelar" onclick="cerrarSelector()">Cancelar</button>
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function (event) {
            if (event.scale !== 1) event.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) event.preventDefault();
            lastTouchEnd = now;
        }, false);

        let currentLevel = 1;
        const maxLevels = 100;
        
        // BANCOS DE PALABRAS
        const palabrasFacil = [
            { palabra: "casa", silabas: ["CA", "SA"], emoji: "🏠" },
            { palabra: "gato", silabas: ["GA", "TO"], emoji: "🐱" },
            { palabra: "luna", silabas: ["LU", "NA"], emoji: "🌙" },
            { palabra: "pato", silabas: ["PA", "TO"], emoji: "🦆" },
            { palabra: "vaca", silabas: ["VA", "CA"], emoji: "🐮" },
            { palabra: "sopa", silabas: ["SO", "PA"], emoji: "🍲" },
            { palabra: "nube", silabas: ["NU", "BE"], emoji: "☁️" },
            { palabra: "tomate", silabas: ["TO", "MA", "TE"], emoji: "🍅" },
            { palabra: "pelota", silabas: ["PE", "LO", "TA"], emoji: "⚽" },
            { palabra: "camisa", silabas: ["CA", "MI", "SA"], emoji: "👕" }
        ];

        const palabrasMedio = [
            { palabra: "mochila", silabas: ["MO", "CHI", "LA"], emoji: "🎒" },
            { palabra: "paloma", silabas: ["PA", "LO", "MA"], emoji: "🕊️" },
            { palabra: "caballo", silabas: ["CA", "BA", "LLO"], emoji: "🐴" },
            { palabra: "zapato", silabas: ["ZA", "PA", "TO"], emoji: "👞" },
            { palabra: "corona", silabas: ["CO", "RO", "NA"], emoji: "👑" },
            { palabra: "tesoro", silabas: ["TE", "SO", "RO"], emoji: "🏴‍☠️" },
            { palabra: "mariposa", silabas: ["MA", "RI", "PO", "SA"], emoji: "🦋" },
            { palabra: "telefono", silabas: ["TE", "LE", "FO", "NO"], emoji: "☎️" },
            { palabra: "caramelo", silabas: ["CA", "RA", "ME", "LO"], emoji: "🍬" }
        ];

        const palabrasDificil = [
            { palabra: "mariposa", silabas: ["MA", "RI", "PO", "SA"], emoji: "🦋" },
            { palabra: "telefono", silabas: ["TE", "LE", "FO", "NO"], emoji: "☎️" },
            { palabra: "semaforo", silabas: ["SE", "MA", "FO", "RO"], emoji: "🚥" },
            { palabra: "calabaza", silabas: ["CA", "LA", "BA", "ZA"], emoji: "🎃" },
            { palabra: "lavadora", silabas: ["LA", "VA", "DO", "RA"], emoji: "🧺" },
            { palabra: "limonada", silabas: ["LI", "MO", "NA", "DA"], emoji: "🍋" },
            { palabra: "zapatilla", silabas: ["ZA", "PA", "TI", "LLA"], emoji: "👟" },
            { palabra: "gusanito", silabas: ["GU", "SA", "NI", "TO"], emoji: "🐛" },
            { palabra: "pelicano", silabas: ["PE", "LI", "CA", "NO"], emoji: "🐦" },
            { palabra: "hipopotamo", silabas: ["HI", "PO", "PO", "TA", "MO"], emoji: "🦛" }
        ];

        const silabasDistractoras = ["PA", "MA", "SA", "LA", "TA", "PE", "ME", "SE", "LE", "TE", "CA", "CO", "CU", "PO", "PI", "RO", "RU", "NA", "NO", "BO"];

        let itemActual = null;
        let ultimaPreguntaTexto = "";
        let ultimaPalabra = ""; // Variable para evitar repetir la misma palabra de corrido
        let silabasRestantes = []; 
        let silabasArmadas = [];

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let textoLimpio = texto.replace(/[¿?¡!🤔]/g, '');
                let utterance = new SpeechSynthesisUtterance(textoLimpio);
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function hablarSilaba(silaba) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let fonetica = silaba.toLowerCase();
                fonetica = fonetica.replace('a', 'á').replace('e', 'é').replace('i', 'í').replace('o', 'ó').replace('u', 'ú');
                fonetica = fonetica + ".";
                let utterance = new SpeechSynthesisUtterance(fonetica);
                utterance.lang = 'es-ES';
                utterance.rate = 0.75; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function repetirPreguntaActual() {
            hablar(ultimaPreguntaTexto);
        }

        function abrirSelector() { document.getElementById('modal-niveles').style.display = 'flex'; }
        function cerrarSelector() { document.getElementById('modal-niveles').style.display = 'none'; }
        
        function seleccionarDificultad(nivelInicio) {
            currentLevel = nivelInicio;
            ultimaPalabra = ""; // Reiniciamos para que al cambiar de nivel sea 100% fresco
            cerrarSelector();
            playLevel();
        }

        function empezarJuego() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('juego-container').style.display = 'block';
            document.getElementById('btn-config').style.display = 'block';
            initGame();
        }

        function initGame() {
            currentLevel = 1;
            ultimaPalabra = "";
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const questionText = document.getElementById('question-text');
            const imageContainer = document.getElementById('image-container');
            const builderContainer = document.getElementById('word-builder');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            messageDiv.className = "";
            messageDiv.textContent = "";
            
            builderContainer.classList.remove("word-complete");

            let porcentaje = (currentLevel / maxLevels) * 100;
            progressBar.style.width = porcentaje + "%";
            progressText.textContent = `Progreso: Nivel ${currentLevel} de ${maxLevels}`;

            let bancoActual = [];
            if (currentLevel <= 30) {
                bancoActual = palabrasFacil;
                title.textContent = `Nivel ${currentLevel} (Fácil 😊)`;
            } else if (currentLevel <= 60) {
                bancoActual = palabrasMedio;
                title.textContent = `Nivel ${currentLevel} (Medio 😐)`;
            } else {
                bancoActual = palabrasDificil;
                title.textContent = `Nivel ${currentLevel} (Difícil 🥵)`;
            }

            // SELECCIÓN ALEATORIA EVITANDO LA ÚLTIMA PALABRA REPETIDA
            do {
                let indiceAleatorio = Math.floor(Math.random() * bancoActual.length);
                itemActual = bancoActual[indiceAleatorio];
            } while (itemActual.palabra === ultimaPalabra && bancoActual.length > 1);
            
            ultimaPalabra = itemActual.palabra; // Guardamos para la próxima vez
            silabasRestantes = [...itemActual.silabas]; 
            silabasArmadas = []; 

            let textoPregunta = `¿Cómo se escribe ${itemActual.palabra}?`;
            questionText.textContent = textoPregunta + " 🤔";
            ultimaPreguntaTexto = textoPregunta;
            
            hablar(textoPregunta);
            imageContainer.innerHTML = itemActual.emoji;

            builderContainer.innerHTML = "";
            for(let i=0; i < itemActual.silabas.length; i++) {
                const slot = document.createElement('div');
                slot.className = "slot";
                slot.id = "slot-" + i;
                builderContainer.appendChild(slot);
            }

            let options = [...itemActual.silabas];
            let totalBotones = itemActual.silabas.length + 2;
            
            while (options.length < totalBotones) {
                let randomSilaba = silabasDistractoras[Math.floor(Math.random() * silabasDistractoras.length)];
                if (!options.includes(randomSilaba)) {
                    options.push(randomSilaba);
                }
            }

            options.sort(() => Math.random() - 0.5);

            optionsDiv.innerHTML = "";
            options.forEach(silaba => {
                const btn = document.createElement('button');
                btn.className = "opcion";
                btn.textContent = silaba;
                btn.onclick = () => procesarToque(btn, silaba);
                optionsDiv.appendChild(btn);
            });
        }

        function procesarToque(btn, silabaTocada) {
            hablarSilaba(silabaTocada);

            if (silabaTocada === silabasRestantes[0]) {
                silabasRestantes.shift(); 
                silabasArmadas.push(silabaTocada); 

                btn.style.visibility = 'hidden'; 

                const slotActual = document.getElementById("slot-" + (silabasArmadas.length - 1));
                slotActual.textContent = silabaTocada;
                slotActual.classList.add("filled");

                if (silabasRestantes.length === 0) {
                    terminarNivel();
                }

            } else {
                btn.classList.add("shake-animation");
                setTimeout(() => {
                    btn.classList.remove("shake-animation");
                }, 400); 
            }
        }

        function terminarNivel() {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const builderContainer = document.getElementById('word-builder');

            const buttons = Array.from(optionsDiv.children);
            buttons.forEach(btn => {
                btn.style.opacity = "0";
                btn.style.pointerEvents = "none";
            });

            builderContainer.classList.add("word-complete");

            messageDiv.textContent = `¡Muy bien! 🎉`;
            messageDiv.style.color = "#00b894";
            messageDiv.className = "animacion-exito";
            
            setTimeout(() => {
                hablar(`${itemActual.palabra}, muy bien Pol`);
            }, 600);

            setTimeout(() => {
                currentLevel++;
                if (currentLevel > maxLevels) {
                    endGame();
                } else {
                    playLevel();
                }
            }, 3000); 
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Lo lograste!";
            document.getElementById('question-text').textContent = "¡Armaste todas las palabras!";
            document.getElementById('image-container').innerHTML = "🏆👑🥳✨";
            document.getElementById('word-builder').innerHTML = "";
            document.getElementById('progress-bar').style.width = "100%";
            document.getElementById('progress-text').textContent = "¡Completado al 100%!";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('btn-config').style.display = 'none';
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Eres un campeón, Pol!";
            messageDiv.style.color = "#e17055";
            messageDiv.className = "animacion-exito";
            
            hablar("¡Completaste todas las palabras, eres un campeón, Pol!");

            const restartBtn = document.createElement('button');
            restartBtn.className = "opcion";
            restartBtn.textContent = "Jugar de nuevo";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.style.flex = "none";
            restartBtn.style.width = "auto";
            restartBtn.onclick = () => {
                document.getElementById('btn-config').style.display = 'block';
                initGame();
            };
            document.getElementById('options-container').appendChild(restartBtn);
        }
    </script>
</body>
</html>

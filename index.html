<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="icono3.png" sizes="any">
    <link rel="apple-touch-icon" href="icono3.png">
    <link rel="shortcut icon" href="icono3.png">
    
    <title>Juego de Armar Palabras para Pol</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            background-color: #fff9e6;
            margin: 0;
            padding: 20px;
            user-select: none;
            position: relative;
            touch-action: manipulation; 
            overscroll-behavior-y: contain; 
        }

        h1 {
            color: #e17055;
            font-size: 2.2rem;
            margin-bottom: 0px;
            margin-top: 35px;
        }
        
        #question-text {
            font-size: 2.5rem;
            color: #0984e3;
            margin: 15px 0;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        #image-container {
            font-size: 6.5rem;
            margin: 5px auto;
            max-width: 600px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor de las casillas de la palabra armada */
        #word-builder {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px auto;
            min-height: 70px;
            transition: all 0.5s ease; /* Transición suave para cuando crece */
        }

        .slot {
            width: 75px;
            height: 75px;
            border: 4px dashed #b2bec3;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: transparent;
            background-color: transparent;
            transition: all 0.3s ease;
        }

        .slot.filled {
            background-color: #0984e3;
            border: 4px solid #0984e3;
            color: white;
            box-shadow: 0 6px 0 #005f9e;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        button.opcion {
            font-size: 2.6rem;
            font-weight: bold;
            padding: 15px 25px;
            border: none;
            border-radius: 20px;
            background-color: #00b894;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #006652;
            transition: opacity 0.3s ease, transform 0.1s; /* Agregada transición de opacidad para desaparecer */
            min-width: 80px;
            flex: 1 1 40%;
        }
        button.opcion:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #006652;
        }
        
        #message {
            font-size: 2.2rem;
            margin-top: 15px;
            font-weight: bold;
            min-height: 40px;
            opacity: 0;
        }

        #pantalla-inicio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 75vh;
            gap: 20px;
        }
        #btn-iniciar {
            font-size: 2.5rem;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 25px;
            background-color: #e17055;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #d63031;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        #btn-iniciar:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #d63031;
        }
        .intro-titulo {
            font-size: 3rem;
            color: #0984e3;
            margin-bottom: 10px;
        }
        .intro-icono {
            font-size: 5rem;
        }

        #juego-container {
            display: none;
        }

        .progress-wrapper {
            width: 85%;
            max-width: 450px;
            margin: 20px auto 10px auto;
            text-align: center;
        }
        #progress-text {
            font-size: 1.1rem;
            color: #0984e3;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #progress-container {
            width: 100%;
            background-color: #dfe6e9;
            border-radius: 20px;
            height: 22px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
            border: 3px solid #b2bec3;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fdcb6e, #e17055);
            border-radius: 15px;
            transition: width 0.5s ease;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animacion-exito {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* Animación para que la palabra completa crezca */
        @keyframes growWord {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1.15); }
        }
        .word-complete {
            animation: growWord 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Animación para cuando toca la sílaba incorrecta */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); background-color: #d63031; box-shadow: 0 6px 0 #b33939; }
            40%, 80% { transform: translateX(10px); background-color: #d63031; box-shadow: 0 6px 0 #b33939; }
        }
        .shake-animation {
            animation: shake 0.4s;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.5rem; margin-top: 25px; }
            #question-text { font-size: 1.8rem; margin: 10px 0; }
            #image-container { font-size: 5rem; min-height: 80px; }
            .slot { width: 65px; height: 65px; font-size: 2.2rem; }
            .options { gap: 10px; max-width: 320px; }
            button.opcion { font-size: 2.2rem; padding: 12px 10px; }
            #message { font-size: 1.8rem; min-height: 35px; }
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div class="intro-icono">🧩🔤</div>
        <div class="intro-titulo">¡Arma la Palabra!</div>
        <button id="btn-iniciar" onclick="empezarJuego()">¡Iniciar Juego!</button>
    </div>

    <div id="juego-container">
        <h1 id="level-title">Nivel 1</h1>
        <div id="question-text" onclick="repetirPreguntaActual()">¿Cómo se escribe? 🤔</div>
        
        <div id="image-container"></div>
        
        <div id="word-builder"></div>

        <div class="options" id="options-container"></div>
        <div id="message"></div>

        <div class="progress-wrapper">
            <div id="progress-text">Progreso: Nivel 1 de 20</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function (event) {
            if (event.scale !== 1) event.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) event.preventDefault();
            lastTouchEnd = now;
        }, false);

        let currentLevel = 1;
        const maxLevels = 20;
        
        // Banco de palabras revisado: Todas inconfundibles y directas
        const palabrasBanco = [
            { palabra: "casa", silabas: ["CA", "SA"], emoji: "🏠" },
            { palabra: "gato", silabas: ["GA", "TO"], emoji: "🐱" },
            { palabra: "luna", silabas: ["LU", "NA"], emoji: "🌙" },
            { palabra: "moto", silabas: ["MO", "TO"], emoji: "🏍️" },
            { palabra: "auto", silabas: ["AU", "TO"], emoji: "🚗" },
            { palabra: "pato", silabas: ["PA", "TO"], emoji: "🦆" },
            { palabra: "vaca", silabas: ["VA", "CA"], emoji: "🐮" },
            { palabra: "mano", silabas: ["MA", "NO"], emoji: "✋" },
            { palabra: "nube", silabas: ["NU", "BE"], emoji: "☁️" },
            { palabra: "dado", silabas: ["DA", "DO"], emoji: "🎲" },
            { palabra: "bota", silabas: ["BO", "TA"], emoji: "👢" },
            { palabra: "sopa", silabas: ["SO", "PA"], emoji: "🍲" },
            { palabra: "loro", silabas: ["LO", "RO"], emoji: "🦜" },
            { palabra: "pino", silabas: ["PI", "NO"], emoji: "🌲" },
            { palabra: "rosa", silabas: ["RO", "SA"], emoji: "🌹" },
            { palabra: "dedo", silabas: ["DE", "DO"], emoji: "👆" },
            { palabra: "foco", silabas: ["FO", "CO"], emoji: "💡" },
            { palabra: "mono", silabas: ["MO", "NO"], emoji: "🐒" },
            { palabra: "lobo", silabas: ["LO", "BO"], emoji: "🐺" },
            { palabra: "taza", silabas: ["TA", "ZA"], emoji: "☕" }
        ];

        const silabasDistractoras = ["PA", "MA", "SA", "LA", "TA", "PE", "ME", "SE", "LE", "TE", "CA", "CO", "CU", "PO", "PI", "RO", "RU", "NA", "NO", "BO"];

        let itemActual = null;
        let ultimaPreguntaTexto = "";
        let silabasRestantes = []; 
        let silabasArmadas = [];

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let textoLimpio = texto.replace(/[¿?¡!🤔]/g, '');
                let utterance = new SpeechSynthesisUtterance(textoLimpio);
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function hablarSilaba(silaba) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let fonetica = silaba.toLowerCase();
                fonetica = fonetica.replace('a', 'á').replace('e', 'é').replace('i', 'í').replace('o', 'ó').replace('u', 'ú');
                fonetica = fonetica + ".";
                let utterance = new SpeechSynthesisUtterance(fonetica);
                utterance.lang = 'es-ES';
                utterance.rate = 0.75; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function repetirPreguntaActual() {
            hablar(ultimaPreguntaTexto);
        }

        function empezarJuego() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('juego-container').style.display = 'block';
            initGame();
        }

        function initGame() {
            currentLevel = 1;
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const questionText = document.getElementById('question-text');
            const imageContainer = document.getElementById('image-container');
            const builderContainer = document.getElementById('word-builder');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            messageDiv.className = "";
            messageDiv.textContent = "";
            
            // Le quitamos la animación de la palabra completada si la tuviera del nivel anterior
            builderContainer.classList.remove("word-complete");

            let porcentaje = (currentLevel / maxLevels) * 100;
            progressBar.style.width = porcentaje + "%";
            progressText.textContent = `Progreso: Nivel ${currentLevel} de ${maxLevels}`;

            title.textContent = `Nivel ${currentLevel}`;

            itemActual = palabrasBanco[(currentLevel - 1) % palabrasBanco.length];
            silabasRestantes = [...itemActual.silabas]; 
            silabasArmadas = []; 

            let textoPregunta = `¿Cómo se escribe ${itemActual.palabra}?`;
            questionText.textContent = textoPregunta + " 🤔";
            ultimaPreguntaTexto = textoPregunta;
            
            hablar(textoPregunta);
            imageContainer.innerHTML = itemActual.emoji;

            builderContainer.innerHTML = "";
            for(let i=0; i < itemActual.silabas.length; i++) {
                const slot = document.createElement('div');
                slot.className = "slot";
                slot.id = "slot-" + i;
                builderContainer.appendChild(slot);
            }

            let options = [...itemActual.silabas];
            while (options.length < 4) {
                let randomSilaba = silabasDistractoras[Math.floor(Math.random() * silabasDistractoras.length)];
                if (!options.includes(randomSilaba)) {
                    options.push(randomSilaba);
                }
            }

            options.sort(() => Math.random() - 0.5);

            optionsDiv.innerHTML = "";
            options.forEach(silaba => {
                const btn = document.createElement('button');
                btn.className = "opcion";
                btn.textContent = silaba;
                btn.onclick = () => procesarToque(btn, silaba);
                optionsDiv.appendChild(btn);
            });
        }

        function procesarToque(btn, silabaTocada) {
            hablarSilaba(silabaTocada);

            if (silabaTocada === silabasRestantes[0]) {
                silabasRestantes.shift(); 
                silabasArmadas.push(silabaTocada); 

                btn.style.visibility = 'hidden'; 

                const slotActual = document.getElementById("slot-" + (silabasArmadas.length - 1));
                slotActual.textContent = silabaTocada;
                slotActual.classList.add("filled");

                if (silabasRestantes.length === 0) {
                    terminarNivel();
                }

            } else {
                btn.classList.add("shake-animation");
                setTimeout(() => {
                    btn.classList.remove("shake-animation");
                }, 400); 
            }
        }

        function terminarNivel() {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const builderContainer = document.getElementById('word-builder');

            // Hacemos desaparecer suavemente los botones que sobraron
            const buttons = Array.from(optionsDiv.children);
            buttons.forEach(btn => {
                btn.style.opacity = "0";
                btn.style.pointerEvents = "none";
            });

            // Agregamos la animación para que crezca la palabra armada
            builderContainer.classList.add("word-complete");

            messageDiv.textContent = `¡Muy bien! 🎉`;
            messageDiv.style.color = "#00b894";
            messageDiv.className = "animacion-exito";
            
            setTimeout(() => {
                hablar(`${itemActual.palabra}, muy bien Pol`);
            }, 600);

            setTimeout(() => {
                currentLevel++;
                if (currentLevel > maxLevels) {
                    endGame();
                } else {
                    playLevel();
                }
            }, 2800); 
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Lo lograste!";
            document.getElementById('question-text').textContent = "¡Armaste todas las palabras!";
            document.getElementById('image-container').innerHTML = "🏆👑🥳✨";
            document.getElementById('word-builder').innerHTML = "";
            document.getElementById('progress-bar').style.width = "100%";
            document.getElementById('progress-text').textContent = "¡Completado al 100%!";
            document.getElementById('options-container').innerHTML = "";
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Eres un campeón, Pol!";
            messageDiv.style.color = "#e17055";
            messageDiv.className = "animacion-exito";
            
            hablar("¡Completaste todas las palabras, eres un campeón, Pol!");

            const restartBtn = document.createElement('button');
            restartBtn.className = "opcion";
            restartBtn.textContent = "Jugar de nuevo";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.style.flex = "none";
            restartBtn.style.width = "auto";
            restartBtn.onclick = () => {
                initGame();
            };
            document.getElementById('options-container').appendChild(restartBtn);
        }
    </script>
</body>
</html>
